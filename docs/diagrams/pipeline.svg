<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 540" width="1290" height="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="How an .as file becomes a running game">
<title>How an .as file becomes a running game</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker></defs>
<rect x="0.5" y="0.5" width="1289" height="539" rx="14" fill="#FFFFFF" stroke="#DADCE0"/>
<text x="40" y="48" font-size="20" text-anchor="start" font-weight="bold" fill="#202124">How an .as file becomes a running game</text>
<text x="40" y="72" font-size="13" text-anchor="start" font-weight="normal" fill="#5F6368">One front end, one shared form of the program, two ways to run it.</text>
<rect x="40" y="210" width="120" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="100.0" y="239.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Player.as</text>
<text x="100.0" y="255.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">your source</text>
<rect x="200" y="130" width="420" height="224" rx="12" fill="#F8F9FA" stroke="#BDC1C6" stroke-dasharray="6 4"/>
<text x="214" y="154" font-size="13" text-anchor="start" font-weight="bold" fill="#5F6368">Front end: kas3c   (stage 1)</text>
<polyline points="160,242 214,242" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="216" y="210" width="86" height="64" rx="10" fill="#DDF4E4" stroke="#1E8E3E" stroke-width="1.5"/>
<text x="259.0" y="239.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Lexer</text>
<text x="259.0" y="255.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">text to tokens</text>
<polyline points="302,242 313,242" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="314" y="210" width="86" height="64" rx="10" fill="#DDF4E4" stroke="#1E8E3E" stroke-width="1.5"/>
<text x="357.0" y="239.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Parser</text>
<text x="357.0" y="255.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">tokens to tree</text>
<polyline points="400,242 411,242" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="412" y="210" width="86" height="64" rx="10" fill="#DDF4E4" stroke="#1E8E3E" stroke-width="1.5"/>
<text x="455.0" y="239.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Names</text>
<text x="455.0" y="255.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">resolve names</text>
<polyline points="498,242 509,242" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="510" y="210" width="86" height="64" rx="10" fill="#FFF1CC" stroke="#C77700" stroke-width="1.5"/>
<text x="553.0" y="239.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Types</text>
<text x="553.0" y="255.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">check types</text>
<text x="410" y="316" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">Reports every error as file:line:column</text>
<polyline points="596,242 658,242" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="660" y="210" width="120" height="64" rx="10" fill="#E6EEFA" stroke="#3D6FB6" stroke-width="1.5"/>
<text x="720.0" y="231.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Typed IR</text>
<text x="720.0" y="247.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">one meaning for</text>
<text x="720.0" y="263.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">both backends</text>
<polyline points="780,242 810,242 810,152 838,152" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="810,242 810,332 838,332" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="905" y="108" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">stage 2</text>
<rect x="840" y="120" width="130" height="64" rx="10" fill="#E6EEFA" stroke="#3D6FB6" stroke-width="1.5"/>
<text x="905.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Interpreter</text>
<text x="905.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">runs the IR</text>
<polyline points="970,152 1128,152" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1049" y="144" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">no C++ toolchain</text>
<rect x="1130" y="120" width="120" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="1190.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Editor and</text>
<text x="1190.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">debug builds</text>
<text x="1190" y="204" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">hot reload, debugger</text>
<text x="905" y="288" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">stage 3</text>
<rect x="840" y="300" width="130" height="64" rx="10" fill="#E6EEFA" stroke="#3D6FB6" stroke-width="1.5"/>
<text x="905.0" y="329.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">C++ generator</text>
<text x="905.0" y="345.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">IR to C++</text>
<polyline points="970,332 998,332" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1000" y="300" width="110" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="1055.0" y="329.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">C++ compiler</text>
<text x="1055.0" y="345.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">the platform&#x27;s own</text>
<polyline points="1110,332 1138,332" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1140" y="300" width="110" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="1195.0" y="329.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Release</text>
<text x="1195.0" y="345.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">builds</text>
<text x="1195" y="384" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F6368">native code, no JIT</text>
<rect x="280" y="410" width="260" height="60" rx="10" fill="#E6EEFA" stroke="#3D6FB6" stroke-width="1.5"/>
<text x="410.0" y="437.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Godot API bindings</text>
<text x="410.0" y="453.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">generated from Godot&#x27;s own API description</text>
<polyline points="410,410 410,356" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="556" y="436" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Also generates the call code</text>
<text x="556" y="453" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">that both backends use.</text>
<rect x="40" y="498" width="18" height="14" rx="4" fill="#DDF4E4" stroke="#1E8E3E" stroke-width="1.5"/>
<text x="66" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Built</text>
<rect x="119" y="498" width="18" height="14" rx="4" fill="#FFF1CC" stroke="#C77700" stroke-width="1.5"/>
<text x="145" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">In progress</text>
<rect x="240" y="498" width="18" height="14" rx="4" fill="#FFF8E6" stroke="#C77700" stroke-width="1.5"/>
<text x="266" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Next</text>
<rect x="312" y="498" width="18" height="14" rx="4" fill="#E6EEFA" stroke="#3D6FB6" stroke-width="1.5"/>
<text x="338" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Planned</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="What each folder of the compiler may include">
<title>What each folder of the compiler may include</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#FFFFFF" stroke="#DADCE0"/>
<text x="40" y="48" font-size="20" text-anchor="start" font-weight="bold" fill="#202124">What each folder of the compiler may include</text>
<text x="40" y="72" font-size="13" text-anchor="start" font-weight="normal" fill="#5F6368">An arrow points from a folder to a folder it may include. Nothing else crosses.</text>
<rect x="40" y="200" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="120.0" y="229.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">src/</text>
<text x="120.0" y="245.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">front end</text>
<rect x="40" y="90" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="120.0" y="119.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">lsp/</text>
<text x="120.0" y="135.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">language server</text>
<rect x="290" y="200" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="370.0" y="229.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">ir/</text>
<text x="370.0" y="245.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">typed IR and lowerer</text>
<rect x="540" y="120" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="620.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">vm/</text>
<text x="620.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">interpreter and library</text>
<rect x="540" y="280" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="620.0" y="309.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">backend_cpp/</text>
<text x="620.0" y="325.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">writes the IR as C++</text>
<rect x="790" y="120" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="875.0" y="141.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">runtime/</text>
<text x="875.0" y="157.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">what generated C++</text>
<text x="875.0" y="173.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">is built against</text>
<rect x="790" y="280" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="875.0" y="309.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">godot_ext/</text>
<text x="875.0" y="325.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">the Godot extension</text>
<polyline points="120,154 120,198" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="290,232 202,232" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="540,152 495,152 495,220 452,220" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="540,312 495,312 495,244 452,244" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="790,152 702,152" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="875,280 875,186" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="790,312 702,312" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="790" y="390" width="170" height="50" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="875.0" y="412.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">godot-cpp</text>
<text x="875.0" y="428.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">Godot&#x27;s C++ bindings</text>
<polyline points="875,344 875,388" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="40" y="320" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Godot&#x27;s API reaches src/ as AS3</text>
<text x="40" y="337" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">declarations, never as a header.</text>
<text x="540" y="384" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">Generated C++ includes</text>
<text x="540" y="401" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">runtime/kas3.h and nothing else.</text>
<text x="290" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">godot_ext/ may also include</text>
<text x="290" y="317" font-size="12" text-anchor="start" font-weight="normal" fill="#5F6368">vm/, ir/ and src/.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The three kinds of call">
<title>The three kinds of call</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="429" rx="14" fill="#FFFFFF" stroke="#DADCE0"/>
<text x="40" y="48" font-size="20" text-anchor="start" font-weight="bold" fill="#202124">The three kinds of call</text>
<text x="40" y="72" font-size="13" text-anchor="start" font-weight="normal" fill="#5F6368">Where the time goes when a script runs, in a release build.</text>
<rect x="40" y="100" width="280" height="280" rx="12" fill="#F8F9FA" stroke="#BDC1C6" stroke-dasharray="6 4"/>
<text x="54" y="124" font-size="13" text-anchor="start" font-weight="bold" fill="#5F6368">Godot engine</text>
<rect x="70" y="190" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="180.0" y="237.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Nodes, physics, rendering</text>
<text x="180.0" y="253.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">the engine&#x27;s own C++</text>
<rect x="600" y="100" width="360" height="280" rx="12" fill="#F8F9FA" stroke="#BDC1C6" stroke-dasharray="6 4"/>
<text x="614" y="124" font-size="13" text-anchor="start" font-weight="bold" fill="#5F6368">Your AS3 code, compiled to native code</text>
<rect x="640" y="150" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="715.0" y="179.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Player</text>
<text x="715.0" y="195.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">extends CharacterBody2D</text>
<rect x="640" y="290" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5"/>
<text x="715.0" y="319.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#202124">Enemy</text>
<text x="715.0" y="335.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5F6368">a plain AS3 class</text>
<polyline points="320,166 638,166" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="460" y="156" font-size="13" text-anchor="middle" font-weight="bold" fill="#202124">1   _physics_process, signals</text>
<polyline points="640,198 322,198" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="460" y="220" font-size="13" text-anchor="middle" font-weight="bold" fill="#202124">2   move_and_slide()</text>
<polyline points="715,214 715,288" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="730" y="256" font-size="13" text-anchor="start" font-weight="bold" fill="#202124">3   enemy.hit()</text>
</svg>
